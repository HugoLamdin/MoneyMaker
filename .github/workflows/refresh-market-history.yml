name: Lint GitHub Actions workflows
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    name: Validate workflow configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        
